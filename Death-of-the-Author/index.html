<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Death of the Author</title>
<style>
:root{--bg:#0f1b26;--card:#182a3a;--ink:#f1f5f8;--mute:#c3d0da;--accent:#9cc3de;--accent-ink:#0b1822;--gold:#e8d9a8;--line:#4a6a82;--hl:#ffe14d;--soft:#213a4e;--danger:#ffb4a8;--field:#0f1b26;--size:1;--font:Verdana,Geneva,sans-serif}
body.t-ink{background:linear-gradient(180deg,#0f1b26 0%,#16293a 100%) fixed}
body.t-paper{--bg:#e9eef2;--card:#fff;--ink:#14212c;--mute:#41535f;--accent:#2f5d7c;--accent-ink:#fff;--line:#a9bccb;--soft:#eaf1f6;--danger:#9c2a1a;--field:#fff;--gold:#6b5a1f}
body.t-contrast{--bg:#fff;--card:#fff;--ink:#000;--mute:#1a1a1a;--accent:#0b3d91;--accent-ink:#fff;--gold:#6b4a00;--line:#000;--soft:#eef2ff;--danger:#a00000;--field:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:calc(18px*var(--size));line-height:1.7;letter-spacing:.015em;text-align:left;transition:background .3s}
body.dark-rest{background:#000}
h1,h2,h3{line-height:1.3;margin:.2em 0 .5em}
h1{font-size:2em} h2{font-size:1.5em} h3{font-size:1.2em}
p{margin:.5em 0 1em}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 120px}
header.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:12px}
header.top .brand{font-weight:700;font-size:1.15em;margin-right:auto;color:var(--accent);cursor:default}
.tb{background:transparent;border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:42px;font-size:.82em}
.tb:hover{border-color:var(--accent)}
.now{background:var(--soft);border-left:8px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0}
.now b{display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.prog{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.pill{flex:1;min-width:110px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);font-size:.78em;text-align:center;background:var(--card)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.done{opacity:.7}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 20px 24px;box-shadow:0 2px 0 var(--line)}
.lead{font-size:1.1em}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);border-radius:12px;padding:12px 20px;min-height:50px;cursor:pointer;font-weight:700;text-align:center}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent)}
.btn.small{min-height:40px;padding:6px 14px;font-size:.85em}
.btn.small{color:var(--accent-ink)}.btn.sec.small{color:var(--ink)}.coach .btn.small{color:var(--accent)}.coach .btn.sec.small{color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row.end{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0}
.opt{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.flash{background:var(--hl);color:#000}
.opt .ic{font-size:1.6em;display:block}
.opt .t{font-weight:700;display:block}
.opt .s{font-size:.85em;color:var(--mute);display:block}
.opt[disabled]{opacity:.5;cursor:not-allowed}
label.l{display:block;font-weight:700;margin:16px 0 4px}
.hint{color:var(--mute);font-size:.88em;margin:2px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--field);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,select:focus,.btn:focus-visible,.tb:focus-visible,.opt:focus-visible,button:focus-visible{outline:4px solid var(--hl);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.88em;min-height:38px}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prompt{background:var(--soft);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:1.05em}
.step{font-size:.85em;color:var(--mute);margin-bottom:4px}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--accent)}
.gl{border-bottom:2px dotted var(--accent);cursor:help;font-weight:600}
.pop,.modal{position:fixed;z-index:50}
.pop{background:var(--card);border:3px solid var(--accent);border-radius:12px;padding:12px 14px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.modal{inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.modal .box{background:var(--card);border:3px solid var(--accent);border-radius:16px;max-width:720px;width:100%;padding:20px;margin:auto}
.modal .box h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 18px;border-radius:999px;z-index:60;font-size:.85em;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.coach{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--accent);color:var(--accent-ink);padding:12px 16px;box-shadow:0 -4px 18px rgba(0,0,0,.35)}
.coach .in{max-width:780px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.coach p{margin:0;flex:1;min-width:240px}
.coach .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.coach .btn.sec{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
.hl{outline:5px solid var(--hl)!important;outline-offset:4px;animation:pulse 1.4s infinite;border-radius:10px}
@keyframes pulse{50%{outline-color:transparent}}
.changes{list-style:none;padding:0;margin:8px 0}
.changes li{background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.x{background:none;border:none;cursor:pointer;font-size:1.1em;color:var(--danger)}
.box2{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
canvas.pad{width:100%;max-width:640px;aspect-ratio:8/5;background:#fff8f6;border:3px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.sel{border-color:var(--hl);box-shadow:0 0 0 3px var(--accent)}
.rest{text-align:center;padding:30px 10px}
.rest .time{font-size:3.2em;font-weight:700;font-variant-numeric:tabular-nums}
.rest svg{width:min(70vw,280px);height:auto}
.breath{width:140px;height:140px;border-radius:50%;background:var(--accent);margin:30px auto;animation:br 8s ease-in-out infinite;opacity:.8}
@keyframes br{0%,100%{transform:scale(.55)}50%{transform:scale(1.15)}}
.dice{display:inline-flex;gap:6px;flex-wrap:wrap}
.die{background:var(--accent);color:var(--accent-ink);border-radius:10px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.small{font-size:.85em;color:var(--mute)}
.journal h3{border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:1.4em}
.journal .q{color:var(--mute);margin-bottom:0}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:1px 8px;font-size:.8em;margin-right:4px}
img.artimg{display:block;max-width:100%;height:auto}
.hero{float:right;margin:0 0 8px 14px;max-height:150px;width:auto}
.opt img.artimg{height:84px;width:auto;margin:0 auto 8px;max-width:100%;object-fit:contain}
.opt.tb img.artimg{height:70px}
.cover{width:min(100%,300px);border-radius:12px;float:right;margin:0 0 10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.mouse{width:200px;border-radius:10px;margin:8px 0}
.restart{height:110px;width:auto;margin:0 auto 6px}
.clear{clear:both}
@media (max-width:520px){.hero{max-height:90px}.cover{float:none;margin:0 auto 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,.now,.prog,.coach,.row,.toast{display:none!important}body{background:#fff;color:#000}.modal{position:static;background:none}.modal .box{border:none}}
.pnote{background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.95em}
body.paper main textarea,body.paper main input[type=text]{display:none}
body.paper .modal textarea,body.paper .modal input[type=text]{display:none}
.modes{display:grid;gap:10px;margin:12px 0}.modes .opt{text-align:left}
.opt{position:relative}.opt.num{padding-right:42px}
.dn{position:absolute;top:8px;right:10px;min-width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:.8em;font-weight:700;display:flex;align-items:center;justify-content:center}
.dicewrap{display:flex;justify-content:center;margin:14px 0}
.die{width:84px;height:84px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:2.4em;font-weight:700;display:flex;align-items:center;justify-content:center}
.die.roll{animation:dieroll .35s linear infinite}
@keyframes dieroll{0%{transform:rotate(0)}50%{transform:rotate(12deg) scale(1.06)}100%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
.cardwrap{display:flex;justify-content:center;margin:12px 0}
.pcard{width:150px;height:210px;border-radius:14px;background:#fffdf8;border:3px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:10px;font-weight:700;position:relative;font-family:inherit}
.pcard .rk{font-size:1.6em;align-self:flex-start;line-height:1}.pcard .rk.b{align-self:flex-end;transform:rotate(180deg)}.pcard .sy{font-size:4.2em;line-height:1}
.pcard.back{background:linear-gradient(160deg,#ff7ac0,#6b4bd6 55%,#1fb5c9);color:#fff;cursor:pointer;justify-content:center;font-size:1.05em;transition:transform .2s}
.pcard.back:hover{transform:translateY(-5px) rotate(-1.5deg)}
.pcard.flip{animation:flip .6s ease}@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.pcard.joker{color:#7a2fa8}.pcard.joker .ct{font-size:1.5em;letter-spacing:.1em}
.pcard.su-D{color:#0b6f94}.pcard.su-H{color:#b0246f}.pcard.su-C{color:#0b7a55}.pcard.su-S{color:#4a3a9a}
.su{font-weight:700}.su-D{color:var(--c-D)}.su-H{color:var(--c-H)}.su-C{color:var(--c-C)}.su-S{color:var(--c-S)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.lg{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9em}.lg b{display:block}.lg span{color:var(--mute)}
.artimg.wide{width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin:0 0 12px}
.artimg.banner{width:100%;height:120px;object-fit:cover;border-radius:12px;margin:0 0 12px}
@media (prefers-reduced-motion:reduce){.pcard.flip{animation:none}}
.tcard{width:130px;min-height:190px;border-radius:12px;background:#f4f1e8;color:#14212c;border:3px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px;text-align:center;flex:none}
.tcard .top{font-weight:700;font-size:.95em;letter-spacing:.06em}.tcard .sym{font-size:2.4em;line-height:1;font-weight:700;color:#2f5d7c;display:block}
.tcard .nm{font-weight:700;font-size:.85em}.tcard .or{font-size:.75em;text-transform:uppercase;letter-spacing:.08em;color:#41535f}
.tcard.rev .sym{transform:rotate(180deg)}.tcard.rev .or{color:#9c2a1a;font-weight:700}
.tcard.sm{width:100px;min-height:150px;font-size:.9em}.tcard.sm .sym{font-size:1.9em}
.tcard.back{background:repeating-linear-gradient(45deg,#2f5d7c,#2f5d7c 8px,#3b7094 8px,#3b7094 16px);color:#fff;justify-content:center}.tcard.back .nm{color:#fff}
.cardrow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin:10px 0}
.cardrow>div:last-child{flex:1 1 220px;min-width:0}
.role{border-top:2px solid var(--line);margin-top:14px;padding-top:6px}
.scenecard{border:2px solid var(--line);border-radius:14px;padding:6px 14px;margin:12px 0}
.authbox{border:2px dashed var(--accent);border-radius:12px;padding:10px 12px;margin:12px 0;background:var(--soft)}
.scenep{font-size:1.1em}.prompt u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--gold)}.prompt u.def,u.def{text-decoration-color:var(--accent);font-style:italic}
.pill.used{opacity:.6;text-decoration:line-through}
.artimg.tile{display:block;max-width:230px;max-height:190px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;margin:0 auto 12px}.artimg.tile.tall{max-height:300px;max-width:200px;padding:0;background:none}
.grid.pk{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:42vh;overflow:auto}
</style>
</head>

/* ---------- STATE ---------- */
const KEY="dota.save.v1",SKEY="dota.settings.v1";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=s=>esc(s).replace(/\[\[(\w+)(?:\|([^\]]+))?\]\]/g,(m,k,d)=>`<span class="gl" tabindex="0" data-g="${k}">${d||k}</span>`);
const rnd=n=>Math.floor(Math.random()*n);
function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=Object.assign({size:1,font:"verdana",theme:"ink"},ld(SKEY)||{});
let G=null,TUT=false,SAVED_G=null,ASKCB=null,scrollFlag=false,PICK=null;
const FONTS={verdana:"Verdana,Geneva,sans-serif",arial:"Arial,Helvetica,sans-serif",comic:"'Comic Sans MS','Comic Neue',cursive,sans-serif",serif:"Georgia,serif"};
const PP=()=>!!(G&&G.paper);
const pnote=t=>`<div class="pnote"><b>✏️ Write on paper:</b> ${T(t)}</div>`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

function newGame(){return{paper:false,real:false,faceUp:false,stage:"safety",
 spread:[{c:null,text:""},{c:null,text:""},{c:null,text:""}],note:{c:null,q0:"",q1:""},maj:[],ch:0,C:null,log:[],
 end:{a0:"",a1:"",a2:"",defOn:false,def:"",used:false,final:""}}}
function save(){if(TUT||!G)return;sv(KEY,G)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1500)}
function go(stage){G.stage=stage;scrollFlag=true;save();render();if(!TUT)toast("Saved")}
function get(p){return p.split(".").reduce((a,k)=>a==null?a:a[k],G)}
function set(p,v){const ks=p.split(".");const l=ks.pop();let o=G;ks.forEach(k=>o=o[k]);o[l]=v}
const im=(k,c,alt)=>`<img class="artimg ${c||""}" src="${AR(k)}" alt="${esc(alt||"")}">`;
const listen=t=>`<button class="btn sec small" data-a="speak" data-v="${esc(t)}" aria-label="Read this aloud">🔊 Listen</button>`;

/* ---------- CARDS ---------- */
const SVG={
 P:'<circle cx="20" cy="20" r="15"/><polygon points="20,8 24,17 33,17 26,23 29,32 20,26 11,32 14,23 7,17 16,17"/>',
 S:'<polygon points="17,10 20,3 23,10 23,29 17,29"/><path d="M12 29h16M20 29v8"/>',
 C:'<path d="M9 7h22c0 10-4 15-11 15S9 17 9 7zM20 22v11M12 35h16"/>',
 W:'<path d="M20 3v34M20 13c-6-2-8-6-8-9 6 0 8 4 8 9M20 22c6-2 8-6 8-9-6 0-8 4-8 9"/>'};
const svg=k=>`<svg viewBox="0 0 40 40" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[k]}</svg>`;
function mcard(c,small){if(!c)return"";return `<div class="tcard ${c.r?"rev":""} ${small?"sm":""}"><span class="top">${ROMAN[c.n]}</span><span class="sym">✦</span><span class="nm">${esc(MAJ[c.n])}</span><span class="or">${c.r?"Reversed":"Upright"}</span></div>`}
function ncard(ch,rank,r,small){return `<div class="tcard minor ${r?"rev":""} ${small?"sm":""}"><span class="top">${esc(RANKS[rank])}</span><span class="sym">${svg(SUITS[ch].i)}</span><span class="nm">${esc(RANKS[rank])} of ${SUITS[ch].n}</span><span class="or">${r?"Reversed":"Upright"}</span></div>`}
const mkw=c=>c?`<div class="small">Ideas: ${esc(MKW[c.n][c.r?1:0])}</div>`:"";
const mname=c=>c?`${MAJ[c.n]} (${c.r?"Reversed":"Upright"})`:"";
function pool(){const ex=G.spread.map(s=>s.c?s.c.n:-1);return MAJ.map((_,i)=>i).filter(i=>!ex.includes(i))}
function drawMaj(){if(!G.maj.length)G.maj=shuffle(pool());return{n:G.maj.pop(),r:rnd(2)===1}}
function tpl(t){const m=t.match(/^([^{]*)\{([^|}]*)\|([^}]*)\}(.*)$/);return m?{pre:m[1],a:m[2],b:m[3],post:m[4]}:{pre:t,a:"",b:"",post:""}}
function promptHTML(ch,rank,rev,def,defOn){const p=tpl(CHAP[ch].p[rank]);const seg=defOn?`<u class="def">${def?esc(def):"…in your own words…"}</u>`:`<u>${esc(rev?p.b:p.a)}</u>`;return esc(p.pre)+seg+esc(p.post)}
function promptPlain(ch,rank,rev,def,defOn){const p=tpl(CHAP[ch].p[rank]);return p.pre+(defOn?(def||"(own words)"):(rev?p.b:p.a))+p.post}
function minorDeck(){return shuffle(RANKS.map((_,i)=>({rank:i,rev:rnd(2)===1})))}

/* ---------- FIELDS ---------- */
function field0(label,path,o={}){const v=get(path)||"";return `<label class="l" for="${o.id||path}">${T(label)}</label>${o.hint?`<div class="hint">${T(o.hint)}</div>`:""}<textarea id="${o.id||path}" data-b="${path}" ${o.tip?`data-tip="${o.tip}"`:""} placeholder="${esc(o.ph||"")}" rows="${o.rows||4}">${esc(v)}</textarea>`}
function exFor(p){if(EX[p])return EX[p];if(/^C\.cards\.\d\.text$/.test(p))return EX.scene;if(p==="C.msg.text")return EX.msg;if(/^end\.a\d$/.test(p))return EX[p];return EX[p.replace(/^end\./,"end.")]}
function paperField(l,p){const ex=exFor(p),long=ex&&ex.length>30;return pnote(l)+(ex?(long?`<details class="small"><summary>See an example</summary><p>e.g. ${esc(ex)}</p></details>`:`<div class="small" style="margin:-6px 0 10px 4px">e.g. ${esc(ex)}</div>`):"")}
function field(l,p,o){return PP()?paperField(l,p):field0(l,p,o)}

/* ---------- STORY ---------- */
function story(){const b=[];b.push(["h1","Death of the Author"]);
 b.push(["h2","Character Spread"]);G.spread.forEach((s,i)=>{b.push(["q",SPREAD_ROLE[i].n+(s.c?": "+mname(s.c):"")]);b.push(["p",s.text||"(not written)"])});
 if(G.note.c){b.push(["h2","The Author's note"]);b.push(["q","Card: "+mname(G.note.c)]);NOTEQ.forEach((q,i)=>{b.push(["q",q]);b.push(["p",G.note["q"+i]||"(not written)"])})}
 G.log.forEach(e=>{if(e.kind==="scene"){b.push(["h3",`Chapter ${e.ch+1}, scene ${e.n}`]);b.push(["q",e.prompt]);e.mods.forEach(m=>b.push(["p","("+m+")"]));e.auth.forEach(a=>b.push(["p","(Author's response card: "+a+")"]));b.push(["p",e.text||"(not written)"])}
  else if(e.kind==="chap"){b.push(["h2",`Chapter ${e.ch+1}: ${CHAP[e.ch].t}`])}
  else if(e.kind==="msg"){b.push(["h3",`The Author's message after chapter ${e.ch+1}`]);b.push(["q","Card: "+e.card]);b.push(["p",e.text||"(not written)"])}});
 if(G.stage==="checkin"||G.stage==="journal"){b.push(["h2","Chapter 5: The Resolution"]);C5.forEach((q,i)=>{b.push(["q",q]);b.push(["p",G.end["a"+i]||"(not written)"])});
  b.push(["q","The confrontation"+(G.end.used?" (Defiance used"+(G.end.def?": act "+G.end.def:"")+")":"")]);b.push(["p",G.end.final||"(not written)"])}
 return b}
function storyHTML(){return story().map(([t,x])=>({h1:`<h2>${esc(x)}</h2>`,h2:`<h3>${esc(x)}</h3>`,h3:`<h4>${esc(x)}</h4>`,p:`<p>${esc(x)}</p>`,q:`<p class="q"><b>${esc(x)}</b></p>`}[t])).join("")}
function storyMD(){return story().map(([t,x])=>({h1:`# ${x}\n`,h2:`\n## ${x}\n`,h3:`\n### ${x}\n`,p:`${x}\n`,q:`**${x}**\n`}[t])).join("\n")}

function sSpread(){const have=G.spread.every(s=>s.c);
 return `<div class="step">Step 3 of 4: Create the Character Spread</div><div class="bar"><i style="width:60%"></i></div><h2>Who is in your story?</h2><p>${T("You are not alone in this story. You draw three [[major|Major Arcana]] cards. Each one is a character written by the Author: you, your [[friend|Friend]] and your [[foe|Foe]]. You keep them in front of you for the whole game.")}</p>
 ${G.real?`<p class="small">Draw three cards from your Major Arcana pile, then tell the app which cards they are.</p>`:(!have?`<div class="row"><button class="btn" data-a="drawSpread" data-tip="draw">🃏 Draw my three cards</button></div>`:"")}
 ${SPREAD_ROLE.map((r,i)=>{const s=G.spread[i];return `<div class="role"><h3>${r.n}</h3>${s.c?`<div class="cardrow">${mcard(s.c)}<div><div class="small">Ideas from this card:</div><div>${esc(MKW[s.c.n][s.c.r?1:0])}</div><p class="small">Use the picture, the name or these ideas. There is no wrong way to read a card.</p>${G.real?`<button class="btn sec small" data-a="pickSpread" data-v="${i}">Change card</button>`:""}</div></div>
 <div class="prompt">${T(r.q)} ${listen(r.q)}<div class="small">Hint: ${esc(r.h)}</div></div>${field("Your answer","spread."+i+".text",{rows:3,tip:i?"":"who"})}`:(G.real?`<button class="btn" data-a="pickSpread" data-v="${i}" data-tip="${i?"":"draw"}">Choose card</button>`:`<p class="small">Draw your cards first.</p>`)}</div>`}).join("")}
 ${have?stuck():""}${pickRow("to:setup","to:note","Next →",!have,"next")}`}

function sNote(){const n=G.note;
 return `<div class="step">Step 4 of 4: The Author's note</div><div class="bar"><i style="width:90%"></i></div>${im("author.jpg","tile tall","The Author tarot card: a figure in a waistcoat reading a book, with a marionette at their side")}<h2>A message from the Author</h2><p>${T("Before your story began, the [[author|Author]] left you a message. Draw one Major Arcana card to decide what kind of message it was.")}</p>
 ${n.c?`<div class="cardrow">${mcard(n.c)}<div>${mkw(n.c)}</div></div>`:(G.real?`<button class="btn" data-a="pickNote" data-tip="draw">Choose my card</button>`:`<div class="row"><button class="btn" data-a="drawNote" data-tip="draw">🃏 Draw a card</button></div>`)}
 ${n.c?NOTEQ.map((q,i)=>`<div class="prompt">${T(q)} ${listen(q)}</div>${field("Your answer","note.q"+i,{rows:3,tip:i?"":"answer"})}`).join("")+stuck():""}
 <div class="small">The card goes back into the Major Arcana deck afterwards.</div>${pickRow("to:spread","startChap","Begin the story →",!n.c,"next")}`}

function sChap(){const C=G.C;if(!C||!C.cards.length)return chapIntro();if(C.phase==="msg")return chapMsg();if(C.cur>=0)return sScene();return chapList()}
const suitName=()=>SUITS[G.ch].n;
function chapHead(){return `<div class="step">Chapter ${G.ch+1}: ${CHAP[G.ch].t} · ${suitName()}</div><div class="bar"><i style="width:${(G.ch)/5*100+((G.C&&G.C.cards.filter(c=>c.done).length)||0)*4}%"></i></div>`}
function chapIntro(){return `${chapHead()}<h2>Chapter ${G.ch+1}: ${CHAP[G.ch].t}</h2>
 <p>${T("In this chapter you use the "+suitName()+" cards. Draw three [[scene|Scene Cards]] and lay them face down. Each card gives you a prompt, a piece of story written by the Author.")}</p>
 <div class="box2 small">${T("This chapter you have one [[reversal|Reversal]] and one [[defiance|Defiance]]. They let you change a prompt. If you use one, you draw a Major Arcana card to see how the Author reacts. Choose wisely.")}</div>
 ${G.real?`<p>Draw three cards from your ${suitName()} pile and lay them face down.</p><div class="row"><button class="btn" data-a="layCards" data-tip="draw">I have laid out three cards</button></div>`:`<div class="row"><button class="btn" data-a="layCards" data-tip="draw">🃏 Draw three scene cards</button></div>`}`}
function chapList(){const C=G.C,done=C.cards.filter(c=>c.done).length;
 return `${chapHead()}<h2>Your three scenes</h2>
 ${C.cards.map((s,i)=>{const cardV=s.flipped?`<div class="cardrow">${s.rank>=0?ncard(G.ch,s.rank,s.rev,true):""}<div>${s.done?`<div class="small">Done</div>`:`<div class="prompt">${promptHTML(G.ch,s.rank,s.rev,s.def,s.defOn)}</div>`}${s.done?`<div class="small">${esc(promptPlain(G.ch,s.rank,s.rev,s.def,s.defOn))}</div>`:G.faceUp?`<button class="btn small" data-a="openScene" data-v="${i}" data-tip="next">Write this scene</button>`:""}</div></div>`
  :`<div class="cardrow"><div class="tcard back sm"><span class="nm">Scene ${i+1}</span></div><div>${nextUnflipped()===i?`<button class="btn" data-a="flip" data-v="${i}" data-tip="flip">${G.real?"Flip card "+(i+1)+" and enter it":"Flip card "+(i+1)}</button>`:`<span class="small">Face down</span>`}</div></div>`;
  return `<div class="scenecard"><h3>Scene ${i+1}</h3>${cardV}</div>`}).join("")}
 ${done===3?`<div class="row end"><span></span><button class="btn" data-a="toMsg" data-tip="next">Finish chapter →</button></div>`:""}`}
const nextUnflipped=()=>{const C=G.C;if(G.faceUp)return C.cards.findIndex(c=>!c.flipped);return C.cards.findIndex(c=>!c.done)}

function sScene(){const C=G.C,s=C.cards[C.cur],i=C.cur,write=s.phase==="write";
 let h=`${chapHead()}<h2>Scene ${i+1}</h2><div class="cardrow">${ncard(G.ch,s.rank,s.rev)}<div><div class="prompt scenep" data-tip="prompt">${promptHTML(G.ch,s.rank,s.rev,s.def,s.defOn)} ${listen(promptPlain(G.ch,s.rank,s.rev,s.def,s.defOn))}</div><div class="small">The ${T("[[underlined|underlined part]]")} is the part you can change.</div></div></div>`;
 s.auth.forEach((a,k)=>{h+=`<div class="authbox"><b>How the Author responded:</b><div class="cardrow">${mcard(a,true)}<div>${mkw(a)}<div class="small">Does the Author indulge you or use your own words against you? The Author still holds the pen.</div></div></div></div>`});
 if(!write){
  h+=`<h3>Your powers</h3><div class="row">`;
  h+=`<button class="btn" data-a="useRev" data-tip="rev" ${C.usedRev||s.pend>0?"disabled":""}>🔄 Use my Reversal${C.usedRev?" (used)":""}</button>`;
  h+=`<button class="btn" data-a="useDef" data-tip="def" ${C.usedDef||s.pend>0||s.defEdit?"disabled":""}>✋ Use my Defiance${C.usedDef?" (used)":""}</button></div>`;
  h+=`<p class="small">${T("[[reversal|Reversal]]: flip the card to the other version of the prompt. [[defiance|Defiance]]: replace the underlined part with anything you want.")}</p>`;
  if(s.defEdit)h+=`<div class="box2">${PP()?pnote("Decide what replaces the underlined part and write it on your paper, then press Confirm."):`<label class="l" for="defin">What replaces the underlined part?</label><input type="text" id="defin" data-b="C.cards.${i}.def" value="${esc(s.def)}" placeholder="for example: a helpful skill">`}<div class="row"><button class="btn" data-a="confirmDef" ${!PP()&&!s.def.trim()?"disabled":""}>Confirm Defiance</button><button class="btn sec" data-a="cancelDef">Cancel</button></div></div>`;
  if(s.pend>0)h+=`<div class="prompt">The Author noticed you changed the story. Draw a Major Arcana card to see how they respond.</div><div class="row">${G.real?`<button class="btn" data-a="pickAuth" data-tip="draw">Choose the card I drew</button>`:`<button class="btn" data-a="drawAuth" data-tip="draw">🃏 Draw the Author's response</button>`}</div>`;
  h+=`<div class="row end"><span>${!s.used&&!s.defEdit?`<button class="btn sec small" data-a="skipScene">I would rather not: draw another card</button>`:""}</span><button class="btn" data-a="toWrite" data-tip="next" ${s.pend>0||s.defEdit?"disabled":""}>Write the scene →</button></div>`}
 else{
  h+=`<p>${T("Use the prompt"+(s.auth.length?" and the Author's response":"")+" to decide how the scene plays out, then record what happens to your Character.")}</p>${field("Write the scene","C.cards."+i+".text",{rows:7,hint:"A few sentences is plenty.",tip:"answer"})}${stuck()}
  <div class="row end"><button class="btn sec" data-a="toRead">← Back</button><button class="btn" data-a="finishScene" data-tip="next">Finish this scene →</button></div>`}
 return h}

function chapMsg(){const C=G.C;return `${chapHead()}<h2>A message from the Author</h2><p>${T("The scenes are done. Your [[author]] leaves you a message, on purpose or by accident. Draw a Major Arcana card to decide what it is about.")}</p>
 <div class="prompt">${esc(CHAP[G.ch].msg)} ${listen(CHAP[G.ch].msg)}</div>
 ${C.msg.c?`<div class="cardrow">${mcard(C.msg.c)}<div>${mkw(C.msg.c)}<p class="small">How does the message reach you? You can show it as a short scene if you like.</p></div></div>${field("Your answer","C.msg.text",{rows:5,tip:"answer"})}${stuck()}`:(G.real?`<button class="btn" data-a="pickMsg" data-tip="draw">Choose the card I drew</button>`:`<div class="row"><button class="btn" data-a="drawMsg" data-tip="draw">🃏 Draw a card</button></div>`)}
 <div class="small">When you continue, the three scene cards are set aside, the ${suitName()} deck is put away, and the Major Arcana cards are shuffled back together (except your Spread).</div>
 ${pickRow("","endChap",G.ch<3?"Next chapter →":"On to chapter 5 →",!C.msg.c,"next")}`}

function sC5(){const e=G.end;
 return `${im("shelf.jpg","tile","A bookcase full of books")}<div class="step">Chapter 5: The Resolution</div><div class="bar"><i style="width:95%"></i></div><h2>Confront your Author</h2><p>Your story is over. It is time to meet your Author. Put the Major Arcana deck aside. The Author cannot use it here.</p><p>Your Author wrote parts of themself into the story, on purpose or without noticing. Answer these questions.</p>
 ${C5.map((q,i)=>`<div class="prompt">${T(q)} ${listen(q)}</div>${field("Your answer","end.a"+i,{rows:3,tip:i?"":"answer"})}`).join("")}${stuck()}
 <h3>The confrontation</h3><div class="prompt">${C5FINAL.slice(0,3).map(esc).join(" ")} You act <u class="${e.used?"def":""}">${e.used?esc(e.defOn&&e.def?e.def:"…in your own words…"):"without mercy"}</u>.</div>
 ${!e.used&&!e.defEdit?`<div class="row"><button class="btn" data-a="useDef5">✋ Use my last Defiance</button></div><p class="small">You have one Defiance. You can replace “without mercy” with anything you want.</p>`:""}
 ${e.defEdit?`<div class="box2">${PP()?pnote("Decide how you act, write it on your paper, then press Confirm."):`<label class="l" for="d5">How do you act instead of “without mercy”?</label><input type="text" id="d5" data-b="end.def" value="${esc(e.def)}" placeholder="for example: with forgiveness">`}<div class="row"><button class="btn" data-a="confirmDef5">Confirm</button><button class="btn sec" data-a="cancelDef5">Cancel</button></div></div>`:""}
 ${field("What do you say and do to your Author?","end.final",{rows:8,hint:"This is your moment. Take your time.",tip:"final"})}
 <div class="row end"><span></span><button class="btn" data-a="to" data-v="checkin" data-tip="next">Finish →</button></div>`}

function sCheckin(){return `<div style="text-align:center">${im("quill.jpg","tile","A quill, an inkwell and a sheet of paper")}<h2>Check in with yourself</h2><p class="lead">Your story is over. Take a quiet moment before you read it back.</p><div class="breath" aria-hidden="true"></div><p>How are you feeling? If any part of the game felt heavy, it is fine to take a break, move around, or talk to someone you trust.</p><div class="row" style="justify-content:center"><button class="btn" data-a="to" data-v="journal" data-tip="next">Finish</button></div></div>`}
function sJournal(){
 if(PP())return `${im("author.jpg","tile tall","The Author tarot card")}<h2>The end</h2><p>Well done. Your story is on your own pages. Keep them somewhere safe and read them back whenever you like.</p><div class="row"><button class="btn" data-a="home">Back to title</button></div>`;
 return `${im("author.jpg","tile tall","The Author tarot card")}<h2>Your story</h2><p>Well done. This is everything you wrote.</p><div class="row"><button class="btn" data-a="dl">⬇ Download (.md)</button><button class="btn sec" data-a="copy">Copy text</button><button class="btn sec" data-a="print">Print</button><button class="btn sec" data-a="home">Back to title</button></div><div class="journal">${storyHTML()}</div>`}

function screen(){if(!G)return sTitle();
 return {safety:sSafety,setup:sSetup,spread:sSpread,note:sNote,chap:sChap,c5:sC5,checkin:sCheckin,journal:sJournal}[G.stage]()}

/* ---------- TUTORIAL ---------- */
const TIPS={
 spread:["Draw three cards. Each one is a character in your story: you, your Friend and your Foe. In the tutorial the cards are fixed.","[data-tip=draw]",()=>{A.drawSpread();SPREAD_ROLE.forEach((r,i)=>set("spread."+i+".text",EX["spread."+i+".text"]));render()},"Draw and fill in an example"],
 note:["The Author left you a message before the story began. Draw a card and answer the two questions.","[data-tip=draw]",()=>{A.drawNote();G.note.q0=EX["note.q0"];G.note.q1=EX["note.q1"];render()},"Draw and fill in an example"],
 chapintro:["Each chapter has three scene cards. Draw them. They stay face down until you flip them.","[data-tip=draw]",()=>A.layCards(),"Draw them for me"],
 chaplist:["Flip the first scene card to reveal its prompt.","[data-tip=flip]",()=>A.flip("0"),"Flip it for me"],
 sceneread:["The underlined part can change. A Reversal flips the card to the other version. A Defiance lets you write your own. You get one of each per chapter. Try the Reversal.","[data-tip=rev]",()=>A.useRev(),"Use the Reversal for me"],
 scenewrite:["Now write what happens. A few sentences is plenty. Then press Finish this scene.","[data-tip=answer]",()=>{G.C.cards[G.C.cur].text=EX.scene;render()},"Fill in an example"]
};
function coach(){if(!TUT)return"";let t=TIPS[pos()];if(pos()==="sceneread"&&G.C.cards[G.C.cur].pend>0)t=["The Author noticed. Draw a Major Arcana card to see how they respond, then press Write the scene.","[data-tip=draw]",()=>A.drawAuth(),"Draw it for me"];
 if(pos()==="sceneread"&&G.C.cards[G.C.cur].used&&G.C.cards[G.C.cur].pend===0&&G.C.cards[G.C.cur].auth.length)t=["Good. Press Write the scene.","[data-tip=next]"];
 if(!t)return"";
 return `<div class="coach" role="complementary"><div class="in"><p><b>Tutorial:</b> ${esc(t[0])}</p>${t[2]?`<button class="btn small" data-a="coachFill">${esc(t[3])}</button>`:""}<button class="btn sec small" data-a="tutExit">Exit tutorial</button></div></div>`}
function coachTarget(){let t=TIPS[pos()];if(!t)return null;if(pos()==="sceneread"){const s=G.C.cards[G.C.cur];if(s.pend>0)return "[data-tip=draw]";if(s.used)return "[data-tip=next]"}return t[1]}

/* ---------- RENDER ---------- */
function render(){
 document.body.className="t-"+S.theme+(PP()?" paper":"");
 document.documentElement.style.setProperty("--size",S.size);document.documentElement.style.setProperty("--font",FONTS[S.font]||FONTS.verdana);
 $("#app").innerHTML=header()+now()+prog()+`<main id="main" class="card">${screen()}</main>`+coach();
 $("#app").style.paddingBottom=TUT?"240px":"";
 if(TUT){const q=coachTarget();if(q){const el=$(q);if(el)el.classList.add("hl")}}
 if(scrollFlag){scrollFlag=false;window.scrollTo(0,0)}
}

/* ---------- MODALS ---------- */
function modal(html){$("#modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;const f=$("#modal .btn,#modal button");if(f)f.focus()}
function closeModal(){$("#modal").innerHTML="";$("#pop").innerHTML=""}
function ask(msg,fn,yes){ASKCB=fn;modal(`<h2>${esc(msg)}</h2><div class="row"><button class="btn" data-a="askYes">${yes||"Yes"}</button><button class="btn sec" data-a="closeModal">Cancel</button></div>`)}
function glossModal(){modal(`<h2>Words</h2><p>Tap any dotted-underline word in the game to see its meaning too.</p>${Object.values(GLOSS).map(g=>`<h3>${g[0]}</h3><p>${esc(g[1])}</p>`).join("")}<button class="btn" data-a="closeModal">Close</button>`)}
function helpModal(){modal(`<h2>Help</h2><p><b>How the game works:</b> you are a Character in a story, and you know it. You draw three cards to create yourself, your Friend and your Foe. Then you play four chapters, each with three scenes. Each scene card gives you a prompt written by the Author. Once per chapter you can use a <b>Reversal</b> or <b>Defiance</b> to change a prompt. After each chapter the Author leaves a message. In the last chapter you confront your Author.</p><div class="row">${TUT?"":`<button class="btn" data-a="tut">Replay the guided tutorial</button>`}<button class="btn sec" data-a="gloss">Open the word list</button><button class="btn sec" data-a="closeModal">Close</button></div><p class="small">Your game saves by itself in this browser. If you clear your browser data, your saved game is removed, so download your story at the end.</p>`)}
function settingsModal(){const sel=(k,o)=>`<select data-set="${k}">${o.map(([v,l])=>`<option value="${v}" ${String(S[k])===String(v)?"selected":""}>${l}</option>`).join("")}</select>`;
 modal(`<h2>Settings</h2><label class="l">Text size</label>${sel("size",[[0.9,"Smaller"],[1,"Normal"],[1.2,"Large"],[1.4,"Extra large"]])}<label class="l">Font</label>${sel("font",[["verdana","Verdana (clear, wide)"],["arial","Arial"],["comic","Comic Sans (easy letter shapes)"],["serif","Georgia"]])}<label class="l">Colours</label>${sel("theme",[["ink","Ink (dark blue)"],["paper","Paper (light)"],["contrast","High contrast"]])}<div class="row"><button class="btn" data-a="closeModal">Done</button></div>`)}
function sheetModal(){modal(`<h2>My Character Spread</h2>${G.spread.map((s,i)=>`<h3>${SPREAD_ROLE[i].n}</h3>${s.c?`<div class="cardrow">${mcard(s.c,true)}<div>${mkw(s.c)}<p>${esc(s.text)||"<span class=small>(not written yet)</span>"}</p></div></div>`:"<p class=small>Not drawn yet.</p>"}`).join("")}<div class="row"><button class="btn" data-a="closeModal">Close</button></div>`)}
function pickerModal(){const P=PICK,names=P.kind==="maj"?MAJ:RANKS.map(r=>r+" of "+SUITS[G.ch].n);
 modal(`<h2>${esc(P.title)}</h2><p>Tap the card you drew, then say whether it was upright or reversed (upside down).</p><div class="grid pk">${names.map((n,i)=>`<button class="opt ${P.n===i?"sel":""}" data-a="pickCard" data-v="${i}"><span class="t">${esc(n)}</span></button>`).join("")}</div>
 <div class="row"><button class="btn ${!P.r?"":"sec"}" data-a="pickOr" data-v="0">Upright</button><button class="btn ${P.r?"":"sec"}" data-a="pickOr" data-v="1">Reversed</button></div><div class="row"><button class="btn" data-a="pickUse" ${P.n<0?"disabled":""}>Use this card</button><button class="btn sec" data-a="pickCancel">Cancel</button></div>`)}
function openPick(kind,title,cb){PICK={kind,title,n:-1,r:false,cb};pickerModal()}

/* ---------- ACTIONS ---------- */
function newChap(){G.C={cards:[],cur:-1,usedRev:false,usedDef:false,phase:"scenes",msg:{c:null,text:""},deck:[]}}
function mkScene(rank,rev,flipped){return{rank,rev,orig:rev,flipped,def:"",defOn:false,defEdit:false,auth:[],pend:0,text:"",done:false,phase:"read",used:false}}
const A={
 start(){modal(`<h2>How do you want to play?</h2><div class="modes"><button class="opt" data-a="begin" data-v="screen"><span class="t">Play on screen</span><span class="s">Type your answers into the app. It keeps your story and you can download it at the end.</span></button><button class="opt" data-a="begin" data-v="paper"><span class="t">Play on paper</span><span class="s">Write on your own paper. You get the same prompts and help, but no typing boxes. Press Next when you have written your answer.</span></button></div><div class="row"><button class="btn sec" data-a="closeModal">Cancel</button></div>`)},
 begin(v){closeModal();G=newGame();G.paper=v==="paper";go("safety")},
 cont(){G=ld(KEY);render()},
 home(){if(!G)return;ask("Go back to the title screen? Your game is saved.",()=>{if(TUT)A.tutExit();else{save();G=null;render()}},"Yes, go back")},
 tut(){closeModal();SAVED_G=TUT?SAVED_G:G;TUT=true;G=newGame();G.stage="spread";scrollFlag=true;render()},
 tutExit(){TUT=false;G=SAVED_G;SAVED_G=null;closeModal();scrollFlag=true;render()},
 coachFill(){let t=TIPS[pos()];if(pos()==="sceneread"&&G.C.cards[G.C.cur].pend>0)return A.drawAuth();if(t&&t[2])t[2]()},
 to(v){go(v)},
 realCards(v){G.real=v==="1";render()},faceUp(v){G.faceUp=v==="1";render()},
 /* spread */
 drawSpread(){if(TUT){[[11,false],[18,false],[9,true]].forEach((x,i)=>G.spread[i].c={n:x[0],r:x[1]})}else{const d=shuffle(MAJ.map((_,i)=>i));G.spread.forEach((s,i)=>s.c={n:d[i],r:rnd(2)===1})}save();render()},
 pickSpread(v){openPick("maj","Which card is "+SPREAD_ROLE[+v].n+"?",c=>{G.spread[+v].c=c;save();render()})},
 drawNote(){G.maj=shuffle(pool());G.note.c=drawMaj();G.maj=[];save();render()},
 pickNote(){openPick("maj","Which card did you draw for the Author's note?",c=>{G.note.c=c;save();render()})},
 startChap(){G.ch=0;G.log.push({kind:"chap",ch:0});G.maj=shuffle(pool());newChap();G.C.phase="scenes";G.C.cards=[];go("chap")},
 /* chapter */
 layCards(){const C=G.C;C.deck=minorDeck();
  if(TUT&&G.ch===0){C.deck=C.deck.filter(d=>d.rank!==0);C.deck.unshift({rank:0,rev:false})}
  if(G.real){C.cards=[0,1,2].map(()=>mkScene(-1,false,false))}
  else{const three=C.deck.splice(0,3);C.cards=three.map(d=>mkScene(d.rank,d.rev,G.faceUp))}
  save();render()},
 flip(v){const i=+v,s=G.C.cards[i];
  if(G.real){openPick("min","Which card did you flip for Scene "+(i+1)+"?",c=>{s.rank=c.n;s.rev=c.r;s.orig=c.r;s.flipped=true;if(!G.faceUp){G.C.cur=i}save();render()})}
  else{s.flipped=true;G.C.cur=i;save();render()}},
 openScene(v){G.C.cur=+v;save();render()},
 useRev(){const C=G.C,s=C.cards[C.cur];s.rev=!s.rev;s.used=true;C.usedRev=true;s.pend++;save();render()},
 useDef(){const s=G.C.cards[G.C.cur];s.defEdit=true;render()},
 cancelDef(){const s=G.C.cards[G.C.cur];s.defEdit=false;s.def="";render()},
 confirmDef(){const C=G.C,s=C.cards[C.cur];s.defEdit=false;s.defOn=true;s.used=true;C.usedDef=true;s.pend++;save();render()},
 drawAuth(){const s=G.C.cards[G.C.cur];s.auth.push(drawMaj());s.pend--;save();render()},
 pickAuth(){openPick("maj","Which Major Arcana card did you draw for the Author's response?",c=>{const s=G.C.cards[G.C.cur];s.auth.push(c);s.pend--;save();render()})},
 skipScene(){const C=G.C,s=C.cards[C.cur];
  if(G.real){openPick("min","Draw a different card. Which card is it?",c=>{s.rank=c.n;s.rev=c.r;s.orig=c.r;save();render()});return}
  const d=C.deck.shift();if(!d){toast("No cards left to draw");return}s.rank=d.rank;s.rev=d.rev;s.orig=d.rev;save();render();toast("Drew a new card")},
 toWrite(){G.C.cards[G.C.cur].phase="write";scrollFlag=true;save();render()},
 toRead(){G.C.cards[G.C.cur].phase="read";render()},
 finishScene(){const C=G.C,s=C.cards[C.cur],mods=[];
  if(s.used){if(s.rev!==s.orig)mods.push("Reversal used");if(s.defOn)mods.push("Defiance used: "+(s.def||"own words"));if(s.rev===s.orig&&!s.defOn)mods.push("Reversal used")}
  G.log.push({kind:"scene",ch:G.ch,n:C.cards.filter(c=>c.done).length+1,prompt:promptPlain(G.ch,s.rank,s.rev,s.def,s.defOn),mods,auth:s.auth.map(mname),text:s.text});
  s.done=true;C.cur=-1;scrollFlag=true;save();
  if(TUT){tutDone();return}render()},
 toMsg(){G.C.phase="msg";scrollFlag=true;save();render()},
 drawMsg(){G.C.msg.c=drawMaj();save();render()},
 pickMsg(){openPick("maj","Which card did you draw for the Author's message?",c=>{G.C.msg.c=c;save();render()})},
 endChap(){const C=G.C;G.log.push({kind:"msg",ch:G.ch,card:mname(C.msg.c),text:C.msg.text});
  if(G.ch<3){G.ch++;G.log.push({kind:"chap",ch:G.ch});G.maj=shuffle(pool());newChap();go("chap")}else{G.maj=[];G.C=null;go("c5")}},
 useDef5(){G.end.defEdit=true;render()},cancelDef5(){G.end.defEdit=false;G.end.def="";render()},
 confirmDef5(){G.end.defEdit=false;G.end.used=true;G.end.defOn=true;save();render()},
  /* picker */
 pickCard(v){PICK.n=+v;pickerModal()},pickOr(v){PICK.r=v==="1";pickerModal()},
 pickUse(){const P=PICK;if(!P||P.n<0)return;PICK=null;closeModal();P.cb({n:P.n,r:P.r})},pickCancel(){PICK=null;closeModal();render()},
 story(){modal(`<h2>${T("[[journal|Story so far]]")}</h2><div class="journal">${storyHTML()}</div><div class="row"><button class="btn" data-a="dl">⬇ Download (.md)</button><button class="btn sec" data-a="print">Print</button><button class="btn sec" data-a="closeModal">Close</button></div>`)},
 sheet(){sheetModal()},gloss(){glossModal()},help(){helpModal()},settings(){settingsModal()},closeModal(){PICK=null;closeModal();render()},
 askYes(){const f=ASKCB;closeModal();if(f)f()},
 dl(){const b=new Blob([storyMD()],{type:"text/markdown"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="my-death-of-the-author-story.md";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)},
 copy(){const t=storyMD();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied")).catch(()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("Copied")}catch(e){}x.remove()})},
 print(){window.print()},
 speak(v){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(v);u.lang="en-GB";speechSynthesis.speak(u)}catch(e){toast("Listening is not available here")}}
};
function tutDone(){modal(`<h2>You finished a practice scene!</h2><p>That is the heart of the game: flip a scene card, decide whether to use your Reversal or Defiance, write what happens, and repeat. After three scenes the Author leaves a message. After four chapters you confront the Author. A full game takes about 1 to 2 hours, and you can download your story at the end.</p><div class="row"><button class="btn" data-a="tutStart">Start my real game</button><button class="btn sec" data-a="tutAgain">Try the tutorial again</button><button class="btn sec" data-a="tutExit">Back to the title</button></div>`)}
A.tutStart=()=>{A.tutExit();A.start()};A.tutAgain=()=>{closeModal();G=newGame();G.stage="spread";scrollFlag=true;render()};

document.addEventListener("click",e=>{
 const g=e.target.closest(".gl");
 if(g){const d=GLOSS[g.dataset.g];if(d){const r=g.getBoundingClientRect();$("#pop").innerHTML=`<div class="pop" style="left:${Math.max(8,Math.min(innerWidth-330,r.left))}px;top:${Math.min(innerHeight-170,r.bottom+6)}px"><b>${d[0]}</b><br>${esc(d[1])}</div>`;e.stopPropagation();return}}
 else if(!e.target.closest(".pop"))$("#pop").innerHTML="";
 const b=e.target.closest("[data-a]");if(!b||b.tagName==="LABEL")return;

});
