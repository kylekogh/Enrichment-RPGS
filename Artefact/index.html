<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artefact: a solo story game</title>
<style>
:root{--bg:#f7f1df;--card:#fffdf4;--ink:#1d2b22;--mute:#4d5e4c;--accent:#1f5a3c;--accent-ink:#fff;--gold:#9a6f00;--line:#d6cba8;--hl:#ffd54a;--soft:#eee6c9;--danger:#8b2d2d;--size:1;--font:Verdana,Geneva,sans-serif}
body.t-green{--bg:#0f1f17;--card:#173024;--ink:#f3ecd2;--mute:#bccab7;--accent:#e2b93b;--accent-ink:#1a1a1a;--gold:#e2b93b;--line:#335a43;--soft:#21402f;--danger:#ff9d9d}
body.t-contrast{--bg:#fff;--card:#fff;--ink:#000;--mute:#1a1a1a;--accent:#0b3d91;--accent-ink:#fff;--gold:#6b4a00;--line:#000;--soft:#eef2ff;--danger:#a00000}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:calc(18px*var(--size));line-height:1.7;letter-spacing:.015em;text-align:left;transition:background .3s}
body.dark-rest{background:#000}
h1,h2,h3{line-height:1.3;margin:.2em 0 .5em}
h1{font-size:2em} h2{font-size:1.5em} h3{font-size:1.2em}
p{margin:.5em 0 1em}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 120px}
header.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:12px}
header.top .brand{font-weight:700;font-size:1.15em;margin-right:auto;color:var(--accent);cursor:default}
.tb{background:transparent;border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:42px;font-size:.82em}
.tb:hover{border-color:var(--accent)}
.now{background:var(--soft);border-left:8px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0}
.now b{display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.prog{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.pill{flex:1;min-width:110px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);font-size:.78em;text-align:center;background:var(--card)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.done{opacity:.7}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 20px 24px;box-shadow:0 2px 0 var(--line)}
.lead{font-size:1.1em}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);border-radius:12px;padding:12px 20px;min-height:50px;cursor:pointer;font-weight:700;text-align:center}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--accent)}
.btn.small{min-height:40px;padding:6px 14px;font-size:.85em}
.btn.small{color:var(--accent-ink)}.btn.sec.small{color:var(--ink)}.coach .btn.small{color:var(--accent)}.coach .btn.sec.small{color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row.end{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0}
.opt{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.flash{background:var(--hl);color:#000}
.opt .ic{font-size:1.6em;display:block}
.opt .t{font-weight:700;display:block}
.opt .s{font-size:.85em;color:var(--mute);display:block}
.opt[disabled]{opacity:.5;cursor:not-allowed}
label.l{display:block;font-weight:700;margin:16px 0 4px}
.hint{color:var(--mute);font-size:.88em;margin:2px 0 6px}
textarea,input[type=text],select{width:100%;background:#fff;color:#111;border:2px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
body.t-green textarea,body.t-green input[type=text],body.t-green select{background:#0f1f17;color:#f3ecd2}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,select:focus,.btn:focus-visible,.tb:focus-visible,.opt:focus-visible,button:focus-visible{outline:4px solid var(--hl);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.88em;min-height:38px}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prompt{background:var(--soft);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:1.05em}
.step{font-size:.85em;color:var(--mute);margin-bottom:4px}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--accent)}
.gl{border-bottom:2px dotted var(--accent);cursor:help;font-weight:600}
.pop,.modal{position:fixed;z-index:50}
.pop{background:var(--card);border:3px solid var(--accent);border-radius:12px;padding:12px 14px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.modal{inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.modal .box{background:var(--card);border:3px solid var(--accent);border-radius:16px;max-width:720px;width:100%;padding:20px;margin:auto}
.modal .box h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 18px;border-radius:999px;z-index:60;font-size:.85em;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.coach{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--accent);color:var(--accent-ink);padding:12px 16px;box-shadow:0 -4px 18px rgba(0,0,0,.35)}
.coach .in{max-width:780px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.coach p{margin:0;flex:1;min-width:240px}
.coach .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.coach .btn.sec{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
.hl{outline:5px solid var(--hl)!important;outline-offset:4px;animation:pulse 1.4s infinite;border-radius:10px}
@keyframes pulse{50%{outline-color:transparent}}
.changes{list-style:none;padding:0;margin:8px 0}
.changes li{background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.x{background:none;border:none;cursor:pointer;font-size:1.1em;color:var(--danger)}
.box2{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
canvas.pad{width:100%;max-width:640px;aspect-ratio:8/5;background:#fffef7;border:3px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.sel{border-color:var(--hl);box-shadow:0 0 0 3px var(--accent)}
.rest{text-align:center;padding:30px 10px}
.rest .time{font-size:3.2em;font-weight:700;font-variant-numeric:tabular-nums}
.rest svg{width:min(70vw,280px);height:auto}
.breath{width:140px;height:140px;border-radius:50%;background:var(--accent);margin:30px auto;animation:br 8s ease-in-out infinite;opacity:.8}
@keyframes br{0%,100%{transform:scale(.55)}50%{transform:scale(1.15)}}
.dice{display:inline-flex;gap:6px;flex-wrap:wrap}
.die{background:var(--accent);color:var(--accent-ink);border-radius:10px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.small{font-size:.85em;color:var(--mute)}
.journal h3{border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:1.4em}
.journal .q{color:var(--mute);margin-bottom:0}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:1px 8px;font-size:.8em;margin-right:4px}
img.artimg{display:block;max-width:100%;height:auto}
body.t-green img.artimg{filter:brightness(2.3) saturate(.85)}
body.t-contrast img.artimg{filter:brightness(.4) contrast(1.5)}
.hero{float:right;margin:0 0 8px 14px;max-height:150px;width:auto}
.opt img.artimg{height:84px;width:auto;margin:0 auto 8px;max-width:100%;object-fit:contain}
.opt.tb img.artimg{height:70px}
.cover{width:min(100%,300px);border-radius:12px;float:right;margin:0 0 10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.mouse{width:200px;border-radius:10px;margin:8px 0}
.restart{height:110px;width:auto;margin:0 auto 6px}
.clear{clear:both}
@media (max-width:520px){.hero{max-height:90px}.cover{float:none;margin:0 auto 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,.now,.prog,.coach,.row,.toast{display:none!important}body{background:#fff;color:#000}.modal{position:static;background:none}.modal .box{border:none}}
.pnote{background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.95em}
body.paper main textarea,body.paper main input[type=text]{display:none}
body.paper .modal textarea,body.paper .modal input[type=text]{display:none}
.modes{display:grid;gap:10px;margin:12px 0}.modes .opt{text-align:left}
.opt{position:relative}.opt.num{padding-right:42px}
.dn{position:absolute;top:8px;right:10px;min-width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:.8em;font-weight:700;display:flex;align-items:center;justify-content:center}
.dicewrap{display:flex;justify-content:center;margin:14px 0}
.die{width:84px;height:84px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:2.4em;font-weight:700;display:flex;align-items:center;justify-content:center}
.die.roll{animation:dieroll .35s linear infinite}
@keyframes dieroll{0%{transform:rotate(0)}50%{transform:rotate(12deg) scale(1.06)}100%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
</style>

const GLOSS={
 artefact:["Artefact / item","In this game YOU are a magical item, such as a sword, a lute or a pair of boots. Artefact is the old-fashioned spelling of artifact. Your item cannot move on its own, so it needs people to carry and use it."],
 keeper:["Keeper","A person who picks you up and uses you. Each Keeper is a short chapter of your story. They come and go, but you last forever."],
 trait:["Trait","A word or short phrase that describes your item, for example Flaming, Loyal or Rusty. There are no wrong traits. A trait means whatever you want it to mean."],
 rest:["Rest","The quiet wait between Keepers. You look away from the screen or close your eyes, and think about what the Rest prompt says. A timer counts it for you. You can always skip it."],
 time:["Time","How long your item waits for the next Keeper: from a day to an epoch (a huge stretch of history). Longer waits mean a longer Rest and more changes to your item and the world."],
 act:["Act","The game has three Acts, like three parts of a play. Act 1 is Newly Forged, Act 2 is A Time of Glory and Act 3 is The Ruination."],
 change:["Change something","At many points the game asks you to change something. You can add, remove or alter: a trait, how your item looks, something in the world (a name, a group of people), or one of your earlier answers."],
 question:["Artefact question","A question only your item can answer, for example 'What name do you gain over time?'. You answer one after each Keeper if you want to. Each can only be used once."],
 journal:["Story so far","The game writes down everything you answer. Open Story so far at any time to read it. At the end you can download it or print it."],
 roll:["Roll / Surprise me","Some choices can be picked at random. The game rolls a virtual dice for you. d6 means a normal six-sided dice. d20 means a twenty-sided dice. You never need real dice."],
 epoch:["Epoch","A very long period of history, thousands of years."],
 epilogue:["Epilogue","A short quiet moment at the end of a story to think about how things ended."]
};

 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);PAD.undo.push(x.getImageData(0,0,800,500));if(PAD.undo.length>12)PAD.undo.shift();[lx,ly]=pt(e);x.strokeStyle=PAD.col;x.lineWidth=PAD.w;x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke()};
 c.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.strokeStyle=PAD.col;x.lineWidth=PAD.w;x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py};
 const up=()=>{if(!d)return;d=false;G.drawing=c.toDataURL("image/png");save()};
 c.onpointerup=up;c.onpointercancel=up;
}

/* ---------- STORY BUILDER ---------- */
function story(){
 const a=art(),nm=itemName(),b=[];
 b.push(["h1",`Artefact: ${nm||a.n}`]);
 b.push(["p",`A story told by ${a.n}${nm?` (${nm})`:""}. Traits now: ${G.traits.filter(Boolean).join(", ")||"none yet"}.`]);
 b.push(["h2","How I was made"]);b.push(["p",G.creator||"(not written yet)"]);
 let last=0;const all=G.keepers.concat(G.cur&&G.cur.k>1?[G.cur]:[]);
 all.forEach((k,i)=>{
  if(k.act!==last){last=k.act;b.push(["h2",`Act ${k.act}: ${ACTS[k.act].n}`])}
  const kd=k.custom?{n:"A Keeper of your own making",q:[k.q1,k.q2]}:ACTS[k.act].keepers.find(x=>x.id===k.id);
  b.push(["h3",`Keeper ${i+1}: ${k.name||kd.n}`]);
  if(k.desc)b.push(["p",k.desc]);
  [[kd.q[0],k.a1],[kd.q[1],k.a2]].forEach(([q,an])=>{if(an)b.push(["q",q]),b.push(["p",an])});
  const e=k.ev;if(e&&e.tbl&&e.idx>=0){const t=TABLES[e.tbl];b.push(["q",`${t.n}: ${t.o[e.idx][0]}. ${t.o[e.idx][1]}`]);if(e.answer)b.push(["p",e.answer]);e.changes.forEach(c=>b.push(["c",chText(c)]))}
  if(k.aq&&k.aq.i>=0){b.push(["q",a.q[k.aq.i]]);if(k.aq.answer)b.push(["p",k.aq.answer])}
  if(k.lost){b.push(["q","How did this Keeper lose you?"]);b.push(["p",k.lost])}
  const r=G.rests[i];
  if(r){b.push(["h3",`Rest after Keeper ${i+1}: ${r.label}${r.sec?` (${fmt(r.sec)})`:""}`]);
   (r.picks||[]).forEach(p=>{const t=TABLES[p.tbl];b.push(["q",`${t.n}: ${t.o[p.idx][0]}. ${t.o[p.idx][1]}`]);if(p.answer)b.push(["p",p.answer]);p.changes.forEach(c=>b.push(["c",chText(c)]))})}
 });
 if(G.colony&&G.colony.gens&&G.colony.gens.length){const c=G.colony;b.push(["h2","The colony I watched"]);b.push(["p",`Home: ${c.env||"?"}. Creatures: ${c.cre||"?"}. Plentiful: ${c.ab||"?"}. Scarce: ${[c.s1,c.s2].filter(Boolean).join(", ")||"?"}.`]);c.gens.forEach((g,i)=>b.push(["p",`Generation ${i+1} (${g.proj}, ${g.out}: ${g.word}): ${g.line}`]));if(c.end)b.push(["p",`The colony felt ${c.end}. ${c.memory||""}`])}
 if(G.stage==="epilogue"||G.stage==="journal")b.push(["h2","The end"]),b.push(["p","The item rests, and waits."]);
 return b}
const chText=c=>(c.type==="trait"?(c.mode==="remove"?"Removed trait: ":"Added trait: "):CHG[c.type]+": ")+c.text;
function storyHTML(){const a=art();return story().map(([t,x])=>({h1:`<h2>${esc(x)}</h2>`,h2:`<h3>${esc(x)}</h3>`,h3:`<h3>${esc(x)}</h3>`,p:`<p>${esc(x)}</p>`,q:`<p class="q"><b>${esc(x)}</b></p>`,c:`<p><span class="tag">Change</span>${esc(x)}</p>`}[t])).join("").replace("<h3>How I was made</h3>",G.drawing?`<img src="${G.drawing}" alt="My drawing" style="max-width:100%;border:2px solid var(--line);border-radius:10px"><h3>How I was made</h3>`:"<h3>How I was made</h3>")}
function storyMD(){return story().map(([t,x])=>({h1:`# ${x}\n`,h2:`\n## ${x}\n`,h3:`\n### ${x}\n`,p:`${x}\n`,q:`**${x}**\n`,c:`- *Change:* ${x}`}[t])).join("\n")}

/* ---------- REST TIMER AND SOUND ---------- */
let REST_AUDIO=null;const MUSIC_m4a="m4a";
function musicFail(a){if(REST_AUDIO===a){REST_AUDIO=null;if(S.sound&&G&&G.stage==="rest"&&!G.rest.done)startAmbient()}}
function musicStart(){
 if(!S.sound||TUT||!G||!G.rest)return false;
 const sec=G.rest.epi?60:G.rest.sec,src="audio/"+sec+"s."+MUSIC_m4a;
 if(REST_AUDIO&&REST_AUDIO.__src===src)return true;
 stopAmbient();
 try{const a=new Audio(src);a.__src=src;a.volume=.8;a.onerror=()=>musicFail(a);REST_AUDIO=a;const p=a.play();if(p&&p.catch)p.catch(()=>musicFail(a));return true}catch(e){return false}}
function musicStop(){if(!REST_AUDIO)return;const a=REST_AUDIO;REST_AUDIO=null;let v=a.volume;const t=setInterval(()=>{v-=.1;if(v<=0.05){clearInterval(t);try{a.pause()}catch(e){}}else a.volume=v},80)}
function tickStop(){clearInterval(restTimer);restTimer=null;if(!(G&&G.stage==="rest")){stopAmbient();musicStop()}}
function tickStart(){clearInterval(restTimer);if(S.sound&&!G.rest.done&&!musicStart())startAmbient();
 restTimer=setInterval(()=>{if(!G||G.stage!=="rest"||G.rest.done){clearInterval(restTimer);return}
  const left=Math.max(0,Math.ceil((G.rest.end-Date.now())/1000));
  const t=$("#rtime"),r=$("#rring");if(t)t.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(r)r.setAttribute("stroke-dashoffset",326.7*(1-left/G.rest.dur));
  if(left<=0){G.rest.done=true;if(!REST_AUDIO)chime();save();render()}},250)}
function startAmbient(){if(audio)return;try{const C=new(window.AudioContext||window.webkitAudioContext)(),m=C.createGain();m.gain.value=0;m.connect(C.destination);m.gain.linearRampToValueAtTime(.06,C.currentTime+3);const os=[110,164.81,220.5].map((f,i)=>{const o=C.createOscillator();o.type="sine";o.frequency.value=f;const g=C.createGain();g.gain.value=.5/(i+1);const l=C.createOscillator();l.frequency.value=.05+i*.03;const lg=C.createGain();lg.gain.value=.25;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(m);o.start();l.start();return[o,l]});audio={C,m,os}}catch(e){}}
function stopAmbient(){if(!audio)return;try{audio.m.gain.linearRampToValueAtTime(0,audio.C.currentTime+.8);const a=audio;setTimeout(()=>{try{a.os.forEach(p=>p.forEach(o=>o.stop()));a.C.close()}catch(e){}},900)}catch(e){}audio=null}
function chime(){try{const C=new(window.AudioContext||window.webkitAudioContext)(),o=C.createOscillator(),g=C.createGain();o.frequency.value=523;g.gain.setValueAtTime(.15,C.currentTime);g.gain.exponentialRampToValueAtTime(.001,C.currentTime+2);o.connect(g);g.connect(C.destination);o.start();o.stop(C.currentTime+2)}catch(e){}}

 if(b.type==="checkbox"&&e.target!==b)return;
 const a=b.dataset.a,v=b.dataset.v;
 const fn=A[a];if(fn)fn(v,b,e);
});
// pickRow uses data-a="to:xxx" for back buttons
document.addEventListener("click",e=>{const b=e.target.closest("[data-a^='to:']");if(b){e.stopImmediatePropagation();go(b.dataset.a.slice(3))}},true);
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.b){set(t.dataset.b,t.value);if(!t.dataset.b.startsWith("UI."))save()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.set){S[t.dataset.set]=isNaN(t.value)||t.value===""?t.value:+t.value;sv(SKEY,S);const m=$("#modal").innerHTML;render();$("#modal").innerHTML=m;$("#modal select[data-set='"+t.dataset.set+"']").value=t.value}if(t.dataset&&t.dataset.b&&t.tagName==="SELECT"){set(t.dataset.b,t.value);save()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();render()}if(e.key==="Enter"&&e.target.id==="chtext"){A.chAdd(e.target.dataset.path)}if(e.key==="Enter"&&e.target.id==="colline"){A.colSave()}if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("gl")){e.target.click();e.preventDefault()}});
/* ---------- DICE HELP ---------- */
GLOSS.dice=["Dice","A die is a small numbered cube you roll to get a random number. A six-sided die shows 1 to 6. In this game a die only helps you choose when you cannot decide. You can use the app's die or a real one, and nothing is locked in until you say so."];
let DICE=null;
const diceOn=()=>S.dice!=="off";
function diceEnhance(){
 if(!diceOn())return;
 ["keepers","aq","times","tbl","opts"].forEach(tip=>{
  const c=document.querySelector(`[data-tip=${tip}]`);if(!c||c.dataset.dice)return;
  const bs=[...c.querySelectorAll(".opt[data-a]")].filter(b=>b.dataset.v!=="custom");
  if(bs.length<2)return;c.dataset.dice=1;
  bs.forEach((b,i)=>{b.classList.add("num");b.insertAdjacentHTML("afterbegin",`<span class="dn" aria-hidden="true">${i+1}</span>`)});
  if(tip!=="opts")c.insertAdjacentHTML("afterend",`<div class="row"><button class="btn sec small" data-a="diceRoll" data-v="${tip}">🎲 Not sure? Roll a die</button></div>`);
 })}
function diceLabels(bs){return bs.map(b=>{const t=b.querySelector(".t")||b.querySelector(".s");return t?t.textContent.trim():b.textContent.trim()})}
function diceModal(){
 const d=DICE,n=d.n,std=[4,6,8,10,12,20],up=std.find(x=>x>=n);
 const tip=std.includes(n)?"":` No ${n}-sided die? Roll a ${up||20}-sided one and roll again if the number is too high.`;
 modal(`<h2>🎲 Roll a die</h2><p>${T("A [[dice|die]] can choose for you. Nothing is locked in until you press Use this.")}</p><div class="dicewrap"><div class="die" id="rdie" aria-live="polite">?</div></div><div id="rres" class="prompt" aria-live="polite"></div><div class="row" id="rbtn"></div><p class="small">Using a real die? Tap the number you rolled (there are ${n} choices).${esc(tip)}</p><div class="chips">${Array.from({length:n},(_,i)=>`<button class="chip" data-a="dicePick" data-v="${i+1}">${i+1}</button>`).join("")}</div><div class="row"><button class="btn sec" data-a="diceClose">I'll choose myself</button></div>`);
}
function diceShow(v){
 const d=DICE,r=$("#rres"),die=$("#rdie");if(!r||!die)return;d.val=v;die.textContent=v;
 r.innerHTML=`You rolled a <b>${v}</b>. That picks: <b>${esc(d.labels[v-1])}</b>.`;
 $("#rbtn").innerHTML=`<button class="btn" data-a="diceUse">Use this</button><button class="btn sec" data-a="diceAgain">Roll again</button>`;
}
function diceAnim(){
 const d=DICE;let k=0;$("#rbtn").innerHTML="";$("#rres").textContent="Rolling…";$("#rdie").classList.add("roll");
 (function step(){const die=$("#rdie");if(!die||DICE!==d)return;
  if(k++<10){die.textContent=1+rnd(d.n);setTimeout(step,70)}else{die.classList.remove("roll");diceShow(1+rnd(d.n))}})();
}
A.diceRoll=tip=>{
 const c=document.querySelector(`[data-tip=${tip}]`);if(!c)return;
 const bs=[...c.querySelectorAll(".opt[data-a]")].filter(b=>b.dataset.v!=="custom");if(bs.length<2)return;
 DICE={tip,bs,n:bs.length,labels:diceLabels(bs),val:0};diceModal();diceAnim()};
A.surprise=()=>A.diceRoll("opts");
A.diceAgain=()=>diceAnim();
A.dicePick=v=>diceShow(+v);
A.diceClose=()=>{DICE=null;closeModal()};
A.diceUse=()=>{
 const d=DICE;if(!d||!d.val)return;DICE=null;closeModal();
 const b=d.bs[d.val-1];if(!b||!document.body.contains(b)){render();return}
 const isOpt=d.tip==="opts",parts=isOpt?b.dataset.v.split("|"):null;
 b.click();
 if(isOpt){const o=get(parts[0]);if(o){o.roll=d.val;render()}}
};

render();
</script></body></html>
